<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - API Service</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .login-card:hover {
            transform: translateY(-5px);
        }
        h1 { 
            color: #333; 
            margin-bottom: 1.5rem;
            font-size: 2rem;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            color: white;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        #mensaje {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        /* Estilos para mensajes de éxito */
        .mensaje-exito {
            background-color: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
            font-size: 18px !important;
            font-weight: 600 !important;
        }
        
        /* Estilos para mensajes de error */
        .mensaje-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        /* Estilos para mensaje de carga */
        .mensaje-carga {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
        }
        
        /* Estilo especial para el mensaje de bienvenida */
        .bienvenido-mensaje {
            font-size: 20px !important;
            font-weight: 700 !important;
            color: #1e7e34 !important;
            padding: 20px !important;
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border-radius: 10px;
            margin-top: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .link-registro {
            display: block;
            margin-top: 20px;
            color: #4facfe;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
        }
        .link-registro:hover { 
            text-decoration: underline;
            color: #008efb;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulse-animation {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Inicio de Sesión</h1>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@email.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            </div>
            
            <button type="submit">
                <span id="buttonText">Entrar al Sistema</span>
            </button>
        </form>
        
        <div id="mensaje"></div>
        
        <a href="/registro" class="link-registro">¿No tienes cuenta? Regístrate aquí</a>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const msgElement = document.getElementById("mensaje");
        const buttonText = document.getElementById("buttonText");
        
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            // Mostrar mensaje de carga
            msgElement.style.display = "block";
            msgElement.className = "mensaje-carga";
            msgElement.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: center;">
                    <div style="width: 20px; height: 20px; border: 3px solid #0c5460; border-top-color: transparent; border-radius: 50%; margin-right: 10px; animation: spin 1s linear infinite;"></div>
                    Verificando credenciales...
                </div>
            `;
            
            // Deshabilitar botón
            const submitButton = form.querySelector('button');
            submitButton.disabled = true;
            buttonText.textContent = "Procesando...";
            
            const data = { 
                email: form.email.value.trim(), 
                password: form.password.value 
            };
            
            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                
                const resultado = await res.json();
                
                // Reiniciar botón
                submitButton.disabled = false;
                buttonText.textContent = "Entrar al Sistema";
                
                if(res.ok) {
                    // ÉXITO - Mostrar mensaje especial de bienvenida
                    msgElement.className = "bienvenido-mensaje pulse-animation";
                    
                    // Extraer el nombre del mensaje si está disponible
                    let mensajeMostrar = resultado.mensaje;
                    if (resultado.usuario && resultado.usuario.name) {
                        mensajeMostrar = `¡BIENVENIDO ${resultado.usuario.name.toUpperCase()}!`;
                    }
                    
                    msgElement.innerHTML = `
                        <div style="text-align: center;">
                            <div style="font-size: 24px; margin-bottom: 10px;">🎉</div>
                            <div style="font-size: 22px; margin-bottom: 10px; font-weight: 700;">${mensajeMostrar}</div>
                            <div style="font-size: 16px; color: #1e7e34; margin-top: 10px;">
                                Has iniciado sesión correctamente
                            </div>
                            ${resultado.usuario ? `
                            <div style="background: rgba(255,255,255,0.7); padding: 10px; border-radius: 5px; margin-top: 15px; font-size: 14px;">
                                <strong>Información:</strong><br>
                                Email: ${resultado.usuario.email}<br>
                                ID: ${resultado.usuario.id}
                            </div>
                            ` : ''}
                        </div>
                    `;
                    
                    // Opcional: Redirigir después de 3 segundos
                    setTimeout(() => {
                        // window.location.href = '/dashboard'; // Si tuvieras un dashboard
                    }, 3000);
                    
                } else {
                    // ERROR
                    msgElement.className = "mensaje-error";
                    msgElement.innerHTML = `
                        <div style="display: flex; align-items: center;">
                            <div style="font-size: 20px; margin-right: 10px;">❌</div>
                            <div>
                                <strong>Error:</strong> ${resultado.mensaje || 'Credenciales incorrectas'}
                            </div>
                        </div>
                    `;
                    
                    // Agregar efecto de shake al formulario
                    form.style.animation = 'shake 0.5s';
                    setTimeout(() => {
                        form.style.animation = '';
                    }, 500);
                }
                
            } catch (err) {
                // Error de conexión
                submitButton.disabled = false;
                buttonText.textContent = "Entrar al Sistema";
                
                msgElement.className = "mensaje-error";
                msgElement.innerHTML = `
                    <div style="display: flex; align-items: center;">
                        <div style="font-size: 20px; margin-right: 10px;">⚠️</div>
                        <div>
                            <strong>Error de conexión:</strong> No se pudo conectar con el servidor
                        </div>
                    </div>
                `;
                console.error("Error:", err);
            }
        });
        
        // Agregar estilo para shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);
        
        // Enfocar automáticamente el primer campo
        document.getElementById('email').focus();
    </script>
</body>
</html>
