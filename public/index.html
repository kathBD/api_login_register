<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - API Service</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 { margin-bottom: 2rem; }
        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s, background 0.3s;
        }
        .btn-reg { background-color: #ff7e5f; color: white; }
        .btn-log { background-color: #4facfe; color: white; }
        button:hover { transform: scale(1.05); opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bienvenido a la API</h1>
        <button class="btn-reg" onclick="window.location.href='/registro'">Registro</button>
        <button class="btn-log" onclick="window.location.href='/login'">Login</button>
    </div>
</body>
</html>
