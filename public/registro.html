<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - API Service</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
              background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .register-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { 
            color: #333; 
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #ff7e5f;
            box-shadow: 0 0 5px rgba(255, 126, 95, 0.2);
        }
        button {
            width: 100%;
            padding: 12px;
              background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        #mensaje {
            margin-top: 20px;
            font-size: 14px;
            padding: 10px;
            border-radius: 4px;
            display: none; /* Se muestra al recibir respuesta */
        }
        .link-back {
            display: block;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .link-back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="register-card">
        <h1>Crear Cuenta</h1>
        <form id="registroForm">
            <div class="input-group">
                <input type="text" name="name" placeholder="Nombre completo" required>
            </div>
            <div class="input-group">
                <input type="email" name="email" placeholder="Correo electrónico" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Contraseña (mín. 6 caracteres)" minlength="6" required>
            </div>
            <button type="submit">Registrarse ahora</button>
        </form>
        
        <p id="mensaje"></p>
        
        <a href="/login" class="link-back">¿Ya tienes cuenta? Inicia sesión</a>
    </div>

    <script>
        const form = document.getElementById("registroForm");
        const msgElement = document.getElementById("mensaje");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            // UI de carga
            msgElement.style.display = "block";
            msgElement.innerText = "Procesando registro...";
            msgElement.style.backgroundColor = "#eee";
            msgElement.style.color = "#333";

            const data = {
                name: form.name.value,
                email: form.email.value,
                password: form.password.value
            };

            try {
                const res = await fetch("/api/registro", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                const resultado = await res.json();
                
                if (res.ok) {
                    msgElement.style.backgroundColor = "#d4edda";
                    msgElement.style.color = "#155724";
                    msgElement.innerText = "¡Registro exitoso! Redirigiendo...";
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    msgElement.style.backgroundColor = "#f8d7da";
                    msgElement.style.color = "#721c24";
                    msgElement.innerText = resultado.mensaje || "Error en el registro";
                }
            } catch (err) {
                msgElement.innerText = "Error de conexión con el servidor";
            }
        });
    </script>
</body>
</html>
